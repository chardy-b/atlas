<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D Portal</title>
  <script type="module" crossorigin src="/mirror/assets/index-C7npKrEU.js"></script>
  <link rel="stylesheet" crossorigin href="/mirror/assets/index-CC2Mlrqm.css">
</head>
<body>
  <div id="app">
    <!-- Start screen -->
    <div id="startScreen">
      <div class="start-content">
        <h1>3D Portal</h1>
        <p class="subtitle">Head-tracked motion parallax</p>
        <button id="startBtn" class="primary-btn">Start Portal</button>
      </div>
    </div>

    <!-- Debug toggle -->
    <button id="debugToggle" class="debug-toggle" title="Toggle debug panel">⚙</button>

    <!-- Debug overlay -->
    <div id="debugOverlay" class="hidden">
      <div class="debug-header">
        <span class="debug-title">Debug</span>
        <button id="closeDebug">✕</button>
      </div>
      <div class="debug-body">
        <div class="debug-row"><span class="dl">Render FPS:</span><span id="renderFps" class="dv">-</span></div>
        <div class="debug-row"><span class="dl">Tracking FPS:</span><span id="trackingFps" class="dv">-</span></div>
        <div class="debug-row"><span class="dl">Raw X/Y/Z:</span><span id="rawPose" class="dv">-</span></div>
        <div class="debug-row"><span class="dl">Filt X/Y/Z:</span><span id="filteredPose" class="dv">-</span></div>
        <div class="debug-row"><span class="dl">Face Conf:</span><span id="faceConf" class="dv">-</span></div>
        <div class="debug-row"><span class="dl">Eye Dist:</span><span id="eyeDist" class="dv">-</span></div>
        <hr>
        <div class="debug-row"><span class="dl">α:</span><input type="range" id="smoothAlpha" min="0.01" max="0.95" step="0.01" value="0.2"></div>
        <div class="debug-row"><span class="dl">Gain X:</span><input type="range" id="xGain" min="0.1" max="4" step="0.1" value="1"></div>
        <div class="debug-row"><span class="dl">Gain Y:</span><input type="range" id="yGain" min="0.1" max="4" step="0.1" value="1"></div>
        <div class="debug-row"><span class="dl">Gain Z:</span><input type="range" id="zGain" min="0.1" max="4" step="0.1" value="1"></div>
        <hr>
        <div class="btn-row">
          <button id="calibrateBtn">Calibrate</button>
          <button id="resetBtn">Reset</button>
          <button id="showCameraBtn">Show Camera</button>
        </div>
        <div class="btn-row">
          <button id="manualModeBtn" class="btn-sm active">Manual</button>
          <button id="cameraModeBtn" class="btn-sm">Camera</button>
        </div>
        <canvas id="topdownCanvas" width="160" height="100"></canvas>
      </div>
    </div>

    <!-- Manual controls (drag region = whole canvas with indicator) -->
    <div id="manualHint" class="hidden">Drag to move · Scroll for depth</div>

    <!-- Hidden camera preview -->
    <video id="cameraPreview" class="hidden" playsinline muted></video>

    <!-- Three.js canvas -->
    <canvas id="portalCanvas"></canvas>
  </div>
</body>
</html>
